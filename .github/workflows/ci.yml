name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentproof
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agentproof_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://agentproof:ci-only-password@localhost:5432/agentproof_test
      RUN_DOCKER_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: docker pull python:3.12-slim
      - run: ruff check src tests scripts && ruff format --check src tests scripts
      - run: pytest -q --junitxml=evals/results/pytest.xml
      - run: python scripts/evaluate.py --suite support --mode baseline --output evals/results/support-baseline.json
      - run: node --check web/app.js
      - run: docker build -t agentproof:ci .
      - run: docker compose --env-file .env.example config --quiet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: evals/results/
